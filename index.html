<!DOCTYPE html>
<html>
<head>
    <title>PantryPal - Home Inventory Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>PantryPal</h1>
        <p>Simple Household Inventory Tracker</p>
        <hr>

        <!-- Summary -->
        <div class="summary">
            <p><strong>Total Items:</strong> <span id="totalItems">0</span> | 
               <strong>Total Stock Value:</strong> Rs. <span id="totalValue">0</span> | 
               <strong>Low Stock Items:</strong> <span id="lowCount" style="color: red;">0</span></p>
        </div>

        <!-- Add Item Inputs -->
        <h3>Add New Item</h3>
        <div class="inputs">
            <input type="text" id="itemName" placeholder="Item Name (e.g. Milk)">
            <input type="number" id="itemQty" placeholder="Quantity">
            <input type="number" id="itemPrice" placeholder="Price (Rs.)">
            <button onclick="addItem()">Add Item</button>
        </div>

        <!-- Search and Filter -->
        <h3>Search & Filter</h3>
        <div class="search-box">
            <input type="text" id="searchName" placeholder="Search item name...">
            <button onclick="searchItem()">Search</button>
            <button onclick="showLowStock()">Show Low Stock</button>
            <button onclick="displayItems(inventory)">Show All</button>
        </div>

        <!-- Inventory Table -->
        <h3>Inventory List</h3>
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total Value</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Javascript will put rows here -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
